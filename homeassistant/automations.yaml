alias: ESPHome：键盘事件
description: ""
triggers:
  - trigger: event
    event_type: esphome.keyboard_02_event
    event_data:
      key_action: up
conditions: []
actions:
  - variables:
      b2_lights:
        - switch.fu_er_lou_gong_zuo_shi_dong_ce_deng_guang_switch_1_2
        - switch.fu_er_lou_gong_zuo_shi_dong_ce_deng_guang_switch_2_2
        - switch.fu_er_lou_gong_zuo_shi_xi_ce_deng_guang_switch_2_2
        - switch.fu_er_lou_gong_zuo_shi_xi_ce_deng_guang_switch_1_2
        - switch.fu_er_lou_ru_hu_deng_guang_switch_2_2
        - switch.fu_er_lou_ru_hu_deng_guang_switch_1_2
        - switch.fu_er_lou_bu_ti_deng_guang_switch_2_2
        - switch.fu_er_lou_bu_ti_deng_guang_switch_1_2
        - switch.fu_er_lou_zou_lang_deng_guang_switch_3_2
        - switch.fu_er_lou_zou_lang_deng_guang_switch_2_2
        - switch.fu_er_lou_zou_lang_deng_guang_switch_1_2
      b1_lights:
        - switch.fu_yi_lou_zou_lang_deng_guang_switch_2_2
        - switch.fu_yi_lou_zou_lang_deng_guang_switch_1_2
        - switch.fu_yi_lou_chu_cang_shi_deng_guang_switch_1_2
        - switch.fu_yi_lou_chu_cang_shi_deng_guang_switch_2_2
        - switch.fu_yi_lou_chu_cang_shi_deng_guang_switch_3_2
      b2_workroom_ac: climate.090615_cn_proxy_708610428_00006_ktp
      key_map:
        "1": switch.fu_yi_lou_zou_lang_deng_guang_switch_2_2
        "2": switch.fu_yi_lou_zou_lang_deng_guang_switch_1_2
        "3": switch.fu_yi_lou_chu_cang_shi_deng_guang_switch_1_2
        "4": switch.fu_yi_lou_chu_cang_shi_deng_guang_switch_2_2
        "5": switch.fu_yi_lou_chu_cang_shi_deng_guang_switch_3_2
        "":
          按键动作定义:
            - 直接写实体名称：执行toggel操作
            - 支持 action / target / data / msg 字段
          组合键: 全大写、首字母顺序书写，例如：ALT+CTRL+SHIFT+WIN+A
          警告!!!: 不要删除这一段，不然原地爆炸。Fuck HA。
          Warning!!!: Do not delete this section, or it will blow up on the spot. Fuck HA.
        ESC:
          action: switch.turn_off
          target: "{{ b2_lights }}"
          msg: 关闭B2全部灯光
        F1: switch.fu_er_lou_gong_zuo_shi_dong_ce_deng_guang_switch_1_2
        F2: switch.fu_er_lou_gong_zuo_shi_dong_ce_deng_guang_switch_2_2
        F3: switch.fu_er_lou_gong_zuo_shi_xi_ce_deng_guang_switch_2_2
        F4: switch.fu_er_lou_gong_zuo_shi_xi_ce_deng_guang_switch_1_2
        F5: switch.fu_er_lou_ru_hu_deng_guang_switch_2_2
        F6: switch.fu_er_lou_ru_hu_deng_guang_switch_1_2
        F7: switch.fu_er_lou_bu_ti_deng_guang_switch_2_2
        F8: switch.fu_er_lou_bu_ti_deng_guang_switch_1_2
        F9: switch.fu_er_lou_zou_lang_deng_guang_switch_3_2
        F10: switch.fu_er_lou_zou_lang_deng_guang_switch_2_2
        F11: switch.fu_er_lou_zou_lang_deng_guang_switch_1_2
        F12:
          action: switch.turn_on
          target: "{{ b2_lights }}"
          msg: 开启B2全部灯光
        GRAVE:
          action: switch.turn_off
          target: "{{ b1_lights }}"
          msg: 关闭B1全部灯光
        KP_8:
          action: climate.set_temperature
          target: "{{ b2_workroom_ac }}"
          data:
            temperature: "{{ (state_attr(b2_workroom_ac, 'temperature') | int) + 1 }}"
          msg: 温度加 {{ (state_attr(b2_workroom_ac, 'temperature') | int) + 1 }}
        KP_2:
          action: climate.set_temperature
          target: "{{ b2_workroom_ac }}"
          data:
            temperature: "{{ (state_attr(b2_workroom_ac, 'temperature') | int) - 1 }}"
          msg: 温度减 {{ (state_attr(b2_workroom_ac, 'temperature') | int) - 1 }}
        KP_4:
          action: climate.set_fan_mode
          target: "{{ b2_workroom_ac }}"
          data:
            fan_mode: >-
              {{ {'低风':'低风','中风':'低风','高风':'中风'}.get(state_attr(b2_workroom_ac,
              'fan_mode'),'低风') }}
          msg: 风量减
        KP_6:
          action: climate.set_fan_mode
          target: "{{ b2_workroom_ac }}"
          data:
            fan_mode: >-
              {{ {'低风':'中风','中风':'高风','高风':'高风'}.get(state_attr(b2_workroom_ac,
              'fan_mode'),'高风') }}
          msg: 风量加
        KP_5:
          action: climate.toggle
          target: "{{ b2_workroom_ac }}"
        KP_DIVIDE:
          action: climate.set_hvac_mode
          target: "{{ b2_workroom_ac }}"
          data:
            hvac_mode: dry
          msg: 除湿
        KP_MULTIPLY:
          action: climate.set_hvac_mode
          target: "{{ b2_workroom_ac }}"
          data:
            hvac_mode: fan_only
          msg: 送风
        KP_PLUS:
          action: climate.set_hvac_mode
          target: "{{ b2_workroom_ac }}"
          data:
            hvac_mode: heat
          msg: 制热
        KP_MINUS:
          action: climate.set_hvac_mode
          target: "{{ b2_workroom_ac }}"
          data:
            hvac_mode: cool
          msg: 制冷
        INSERT:
          action: wake_on_lan.send_magic_packet
          data:
            mac: 01:02:03:04:05:06
          msg: 唤醒 PC
        PAGE_UP:
          msg: 灯光操作：直接按键。设备操作：Control+字母/立刻执行，Alt+字母/获取提示。PRINT SCREEN查询键盘状态。
        PRINTSCREEN:
          msg: |-
            {% set voltage =
            states('sensor.esphome_keyboard_02_battery_voltage') %} 
            {% set uptime = states('sensor.esphome_keyboard_02_uptime') %} 
            Wi-Fi Keyboard 电量：
              {{ ([0, [100, ((voltage | float(0) - 3.0) / (4.2 - 3.0) * 100)] 
                  | min] | max) | round(0) | int }}%，
            电压：{{voltage | round(2)}}伏，  
            已运行：{{ uptime |  int // 60 }}分钟，
        CTRL+S: switch.esphome_plug_01_power
        CTRL+F: switch.qmi_cn_1112070818_psv3_on_p_2_1
        CTRL+P: light.p1s_chamber_light
        CTRL+D: switch.lumi_cn_lumi_158d000273eecc_v1_on_p_2_1
        CTRL+H: switch.cuco_cn_697253100_v3_on_p_2_1
        CTRL+E: switch.lumi_cn_lumi_158d00023aac53_v1_on_p_2_1
        SPACE:
          msg: 标签上大写字母就是对应按键，Control+按键：立刻执行，Alt+按键：获取提示。
      data: "{{trigger.event.data}}"
      mods: |-
        {# 修饰键 #}
        {{ {'alt': data.alt | bool,
           'ctrl': data.ctrl | bool,
           'shift': data.shift | bool,
           'win': data.win | bool} }}
      rawkey: |-
        {# 原始单按键 #}
        {{trigger.event.data.key_name }}
      hotkey: |-
        {# 组合快捷键 #}
        {% set hotkey = ('ALT+' if mods.alt else "") 
           + ('CTRL+' if mods.ctrl else "") 
           + ('SHIFT+' if mods.shift else "")  
           + ('WIN+' if mods.win else "") 
           + (rawkey | string ) %}
        {# 过滤掉单纯修饰键引发的事件 #}
        {{ hotkey if (rawkey not in
        ['L_CTRL','R_CTRL','L_ALT','R_ALT','L_SHIFT','R_SHIFT','L_GUI','R_GUI'])
        else ""}}
      command: |-
        {% if mods.alt and not (mods.ctrl or mods.shift or mods.win) %}
          {# ALT组合键特殊处理：如果没有显式定义，去查找非组合定义、Ctrl+按键定义 #}
          {% set cmd = key_map.get(hotkey | string) or key_map.get(rawkey | string) or key_map.get('CTRL+'+rawkey | string) %} 
          {# 生成默认提示：msg，如果不支持，回退到严格按键定义映射 #}
          {% set cmd = {'msg':(device_name(cmd) + {'off': '已关闭', 'on': '已开启'}.
                  get(states(cmd),''))} 
               if cmd is string else key_map.get(hotkey | string) %}
        {% else %}
          {% set cmd = key_map.get(hotkey | string) %} 
          {# 纯文本定义补全：action、target #}
          {% set cmd = {'action': 'homeassistant.toggle', 'target': cmd} 
             if cmd is string else cmd %}
          {# 生成默认提示：msg #}
          {% set cmd = dict(cmd, msg=({'off': '开启', 'on': '关闭'}.
                  get(states(cmd.target),"关闭") + device_name(cmd.target))) 
               if cmd and ('msg' not in cmd) and cmd.target is string else cmd %}
        {% endif %}
        {{ cmd }}
  - if:
      - condition: template
        value_template: "{{ command != None }}"
    then:
      - if:
          - condition: template
            value_template: "{{ ('action' in command) and 'target' in command }}"
        then:
          - action: "{{ command.get('action') }}"
            target:
              entity_id: "{{ command.get('target') }}"
            data: "{{ command.get('data', {}) }}"
      - if:
          - condition: template
            value_template: "{{  'action' in command and ('target' not in command)}}"
        then:
          - action: "{{ command.get('action') }}"
            data: "{{ command.get('data', {}) }}"
      - if:
          - condition: template
            value_template: "{{ 'msg' in command }}"
        then:
          - action: text.set_value
            metadata: {}
            data:
              value: "{{ command.get('msg') }}"
            target:
              entity_id:
                - text.xiaomi_cn_636354897_x08c_play_text_a_3_1
    else:
      - action: text.set_value
        metadata: {}
        data:
          value: 未定义按键__{{hotkey}}
        target:
          entity_id:
            - text.xiaomi_cn_636354897_x08c_play_text_a_3_1
mode: parallel
max: 10
