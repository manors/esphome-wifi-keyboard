# Board: Generic ESP32-C6 Board (Generic)
# Definition: definitions/boards/generic-esp32c6/manifest.yaml

substitutions:
  ps2_clk_pin: 5
  ps2_data_pin: 4
  power_bank_pin: 6
  fw_version: "0.0.3"
  # Disable mDNS to save power; specify the device IP address here.
  device_ip: 10.0.30.71

esp32:
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: "y"
      CONFIG_PM_DFS_INIT_AUTO: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"
      CONFIG_GPIO_CTRL_FUNC_IN_IRAM: "y"
      CONFIG_PM_SLP_IRAM_OPT: "y"
    advanced:
      flash_chip: generic

globals:
  - id: boot_at
    type: int
    initial_value: "0"
  - id: wifi_connect_at
    type: int
    initial_value: "0"
  - id: api_connect_at
    type: int
    initial_value: "0"
  - id: key_event_at
    type: int
    initial_value: "0"

logger:
  level: DEBUG

wifi:
  use_address: ${device_ip}
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esphome-keyboard
  power_save_mode: HIGH
  on_disconnect:
    - lambda: |-
        id(wifi_connect_at) = millis();
  on_connect:
    - lambda: |-
        id(sensor_wifi_ready).publish_state(millis() - id(wifi_connect_at));
        id(my_ps2_keyboard)->update_leds(true, true, false);

api:
  encryption:
    key: !secret api_password
  outgoing_connection:
    delay: 3s
  homeassistant_services: true
  id: api_server
  batch_delay: 0ms
  on_client_disconnected:
    - lambda: |
        id(api_connect_at) = millis();
  on_client_connected:
    - lambda: |
        id(sensor_api_ready).publish_state(millis() - id(api_connect_at));
        id(my_ps2_keyboard)->update_leds(true, true, true);

web_server:
  auth:
    password: !secret web_password
    type: digest
    username: admin
  ota: false

ota:
  - platform: esphome
    encryption: 

captive_portal:

mdns:
  disabled: true

esphome:
  name: esphome-keyboard-02
  name_add_mac_suffix: false
  project:
    name: "esphome.wifi-keyboard"
    version: ${fw_version}
  includes:
    - wifi_wrap.h
    - <esp_pm.h>
  build_flags:
    - "-Wl,--wrap=esp_wifi_set_config"
  on_boot:
    then:
      - lambda: |-
          id(sensor_boot_ready).publish_state(millis());
          esp_pm_config_t pm_config = {
            .max_freq_mhz = 160,
            .min_freq_mhz = 40,
            .light_sleep_enable = true
          };
          esp_pm_configure(&pm_config);

          id(my_ps2_keyboard)->add_on_key_event_callback([=](const char* action, const char* key_name, uint8_t key_code) {
            if (id(api_server).is_connected()) {
              int now = millis();
              bool is_active = strcmp(action, "down") == 0 && now - id(key_event_at) < 10000;
              if (strcmp(key_name, "L_CTRL") == 0 || strcmp(key_name, "R_CTRL") == 0)
                id(binary_sensor_ctrl).publish_state(is_active);
              else if (strcmp(key_name, "L_ALT") == 0 || strcmp(key_name, "R_ALT") == 0)
                id(binary_sensor_alt).publish_state(is_active);
              else if (strcmp(key_name, "L_SHIFT") == 0 || strcmp(key_name, "R_SHIFT") == 0)
                id(binary_sensor_shift).publish_state(is_active);
              else if (strcmp(key_name, "L_GUI") == 0 || strcmp(key_name, "R_GUI") == 0)
                id(binary_sensor_win).publish_state(is_active);
                
              bool ctrl = id(binary_sensor_ctrl).state;
              bool alt = id(binary_sensor_alt).state;
              bool shift = id(binary_sensor_shift).state;
              bool win = id(binary_sensor_win).state;
              id(send_key_event).execute(action, key_name, ctrl, alt, shift, win);
              
              id(key_event_at) = now;
              id(text_sensor_key_name).publish_state(key_name);
              id(text_sensor_key_action).publish_state(action);
              id(sensor_key_at).publish_state(id(key_event_at));
            }
          });

external_components:
  - source:
      type: local
      path: driver

ps2_keyboard_esp32c6:
  id: my_ps2_keyboard
  clk_pin: ${ps2_clk_pin}
  data_pin: ${ps2_data_pin}
  
interval:
  - interval: 10s
    then:
      - button.press: press_power_btn

script:
  - id: send_key_event
    mode: queued
    parameters:
      key_action: string
      key_name: string
      ctrl: bool
      alt: bool
      shift: bool
      win: bool
    then:
      - homeassistant.event:
          event: esphome.keyboard_02_event
          data:
            key_action: !lambda return key_action;
            key_name: !lambda return key_name;
            ctrl: !lambda 'return ctrl ? "true" : "false";'
            alt: !lambda 'return alt ? "true" : "false";'
            shift: !lambda 'return shift ? "true" : "false";'
            win: !lambda 'return win ? "true" : "false";'

output:
  - platform: gpio
    pin:
      number: ${power_bank_pin}
      mode:
        output: true
        open_drain: true
    id: power_bank_pin
    inverted: true
    
button:
  - platform: restart
    name: Restart
    id: button_restart
    icon: "mdi:restart"
  - platform: template
    name: Power Button
    id: press_power_btn
    icon: "mdi:power"
    on_press:
      - logger.log:
          level: DEBUG
          format: Press power bank button
      - output.turn_on: power_bank_pin
      - lambda: gpio_hold_en(static_cast<gpio_num_t>(${power_bank_pin}));
      - delay: 32ms
      - lambda: gpio_hold_dis(static_cast<gpio_num_t>(${power_bank_pin}));
      - output.turn_off: power_bank_pin
  
sensor:
  - platform: adc
    pin: GPIO0
    name: Battery Voltage
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    name: Boot ready
    id: sensor_boot_ready
    entity_category: diagnostic
    unit_of_measurement: "ms"
    icon: "mdi:timer-play"
    update_interval: never

  - platform: template
    name: Wi-Fi ready
    id: sensor_wifi_ready
    entity_category: diagnostic
    unit_of_measurement: "ms"
    icon: "mdi:wifi"
    update_interval: never

  - platform: template
    name: API ready
    id: sensor_api_ready
    entity_category: diagnostic
    unit_of_measurement: "ms"
    icon: "mdi:handshake"
    update_interval: never

  - platform: template
    name: Key At
    id: sensor_key_at
    unit_of_measurement: "ms"
    update_interval: never
    
  - platform: uptime
    name: Uptime
    id: sensor_uptime
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: Press Ctrl
    id: binary_sensor_ctrl
  - platform: template
    name: Press Shift
    id: binary_sensor_shift
  - platform: template
    name: Press Alt
    id: binary_sensor_alt
  - platform: template
    name: Press Win
    id: binary_sensor_win
  
debug:
  
text_sensor:
  - platform: debug
    reset_reason:
      id: debug_reset_reason
      name: Reset Reason
      disabled_by_default: true
  - platform: template
    name: Key Action
    id: text_sensor_key_action
    update_interval: never
  - platform: template
    name: Key Name
    id: text_sensor_key_name
    update_interval: never
