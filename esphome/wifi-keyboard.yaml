# Board: Generic ESP32-C6 Board (Generic)
# Definition: definitions/boards/generic-esp32c6/manifest.yaml

substitutions:
  fw_version: "0.0.2"
  # 设备在局域网中的 IP 地址（用于快速 OTA 及指定地址，若使用路由器 DHCP 动态分配可注释 wifi 中的 use_address）
  device_ip: 10.0.30.71
  # KeepAlive TCP Ping 探测目标 IP 与端口（如 Home Assistant 服务器 IP 及开放端口）
  ping_target_ip: "10.0.0.6"
  ping_target_port: "8123"

esp32:
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: "y"
      CONFIG_PM_DFS_INIT_AUTO: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"
      CONFIG_GPIO_CTRL_FUNC_IN_IRAM: "y"
      CONFIG_PM_SLP_IRAM_OPT: "y"
    advanced:
      flash_chip: generic

globals:
  - id: boot_at
    type: int
    initial_value: "0"
  - id: wifi_connect_at
    type: int
    initial_value: "0"
  - id: api_connect_at
    type: int
    initial_value: "0"
  - id: key_event_at
    type: int
    initial_value: "0"
  - id: tx_latency
    type: float
    initial_value: "0"

logger:
  level: DEBUG

wifi:
  use_address: ${device_ip}
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esphome-keyboard
  power_save_mode: HIGH
  on_disconnect:
    - lambda: |-
        id(wifi_connect_at) = millis();
  on_connect:
    - lambda: |-
        id(sensor_wifi_ready).publish_state(millis() - id(wifi_connect_at));
        id(my_ps2_keyboard)->update_leds(true, true, false);

api:
  encryption:
    key: !secret api_password
  outgoing_connection:
  homeassistant_services: true
  id: api_server
  batch_delay: 0ms
  on_client_disconnected:
    - lambda: |
        id(api_connect_at) = millis();
  on_client_connected:
    - lambda: |
        id(sensor_api_ready).publish_state(millis() - id(api_connect_at));
        id(my_ps2_keyboard)->update_leds(true, true, true);

web_server:
  auth:
    password: !secret web_password
    type: digest
    username: admin
  ota: false

ota:
  - platform: esphome
    encryption: 

captive_portal:

mdns:
  disabled: true

esphome:
  name: esphome-keyboard-02
  name_add_mac_suffix: false
  project:
    name: "esphome.wifi-keyboard"
    version: ${fw_version}
  includes:
    - wifi_wrap.h
    - <esp_pm.h>
    - <esp_wifi.h>
    - <esp_timer.h>
    - <lwip/sockets.h>
    - <lwip/inet.h>
  build_flags:
    - "-Wl,--wrap=esp_wifi_set_config"
  on_boot:
    priority: 250
    then:
      - lambda: |-
          id(sensor_boot_ready).publish_state(millis());
          esp_pm_config_t pm_config = {
            .max_freq_mhz = 160,
            .min_freq_mhz = 40,
            .light_sleep_enable = true
          };
          esp_pm_configure(&pm_config);

          id(my_ps2_keyboard)->add_on_key_event_callback([=](const char* action, const char* key_name, uint8_t key_code) {
            if (id(api_server).is_connected()) {
              int now = millis();
              bool is_active = strcmp(action, "down") == 0 && now - id(key_event_at) < 10000;
              if (strcmp(key_name, "L_CTRL") == 0 || strcmp(key_name, "R_CTRL") == 0)
                id(binary_sensor_ctrl).publish_state(is_active);
              else if (strcmp(key_name, "L_ALT") == 0 || strcmp(key_name, "R_ALT") == 0)
                id(binary_sensor_alt).publish_state(is_active);
              else if (strcmp(key_name, "L_SHIFT") == 0 || strcmp(key_name, "R_SHIFT") == 0)
                id(binary_sensor_shift).publish_state(is_active);
              else if (strcmp(key_name, "L_GUI") == 0 || strcmp(key_name, "R_GUI") == 0)
                id(binary_sensor_win).publish_state(is_active);
                
              bool ctrl = id(binary_sensor_ctrl).state;
              bool alt = id(binary_sensor_alt).state;
              bool shift = id(binary_sensor_shift).state;
              bool win = id(binary_sensor_win).state;
              id(send_key_event).execute(action, key_name, ctrl, alt, shift, win);
              
              id(key_event_at) = now;
              id(text_sensor_key_name).publish_state(key_name);
              id(text_sensor_key_action).publish_state(action);
              id(sensor_key_at).publish_state(id(key_event_at));
            }
          });


external_components:
  - source:
      type: local
      path: driver

ps2_keyboard_esp32c6:
  id: my_ps2_keyboard
  clk_pin: 5
  data_pin: 4

interval:
  - interval: 10000ms
    then:
      - button.press: sim_press_power_btn
      - lambda: |-
          int64_t t_start = esp_timer_get_time();
          int sock = ::socket(AF_INET, SOCK_STREAM, IPPROTO_IP);
          if (sock >= 0) {
            struct timeval tv = { .tv_sec = 1, .tv_usec = 0 };
            setsockopt(sock, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
            setsockopt(sock, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));
            
            struct sockaddr_in ha_addr;
            const char *ip = "${ping_target_ip}";
            const int port = ${ping_target_port};
            ha_addr.sin_addr.s_addr = inet_addr(ip);
            ha_addr.sin_family = AF_INET;
            ha_addr.sin_port = htons(port);
            
            int err = connect(sock, (struct sockaddr *)&ha_addr, sizeof(ha_addr));
            int64_t t_end = esp_timer_get_time();
            close(sock);
            
            if (err == 0) {
              float rtt_ms = (t_end - t_start) / 1000.0f;
              id(tx_latency) = rtt_ms;
              ESP_LOGI("KeepAlive", "TCP Ping %s:%d -> %.2f ms", ip, port, rtt_ms);
            } else {
              ESP_LOGW("KeepAlive", "TCP Ping %s:%d -> (errno=%d)", ip, port, errno);
            }
          }

script:
  - id: send_key_event
    mode: queued
    parameters:
      key_action: string
      key_name: string
      ctrl: bool
      alt: bool
      shift: bool
      win: bool
    then:
      - homeassistant.event:
          event: esphome.keyboard_02_event
          data:
            key_action: !lambda return key_action;
            key_name: !lambda return key_name;
            ctrl: !lambda 'return ctrl ? "true" : "false";'
            alt: !lambda 'return alt ? "true" : "false";'
            shift: !lambda 'return shift ? "true" : "false";'
            win: !lambda 'return win ? "true" : "false";'

output:
  - platform: gpio
    pin:
      number: GPIO6
      mode:
        output: true
        open_drain: true
    id: power_trigger_pin
    inverted: true
    
button:
  - platform: restart
    name: Restart
    id: button_restart
    icon: "mdi:restart"
  - platform: template
    name: "Power Button"
    id: sim_press_power_btn
    on_press:
      - output.turn_on: power_trigger_pin
      - delay: 200ms
      - output.turn_off: power_trigger_pin
  
sensor:
  - platform: adc
    pin: GPIO0
    name: "Battery Voltage"
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    name: "Boot ready"
    id: sensor_boot_ready
    entity_category: diagnostic
    unit_of_measurement: "ms"
    icon: "mdi:timer-play"
    update_interval: never

  - platform: template
    name: "Wi-Fi ready"
    id: sensor_wifi_ready
    entity_category: diagnostic
    unit_of_measurement: "ms"
    icon: "mdi:wifi"
    update_interval: never

  - platform: template
    name: "API ready"
    id: sensor_api_ready
    entity_category: diagnostic
    unit_of_measurement: "ms"
    icon: "mdi:handshake"
    update_interval: never

  - platform: template
    name: "TX latency"
    id: sensor_tx_latency
    entity_category: diagnostic
    unit_of_measurement: "ms"
    accuracy_decimals: 2
    lambda: |-
      return id(tx_latency);

  - platform: template
    name: Key At
    id: sensor_key_at
    unit_of_measurement: "ms"
    update_interval: never
    
  - platform: uptime
    name: Uptime
    id: sensor_uptime
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: Press Ctrl
    id: binary_sensor_ctrl
  - platform: template
    name: Press Shift
    id: binary_sensor_shift
  - platform: template
    name: Press Alt
    id: binary_sensor_alt
  - platform: template
    name: Press Win
    id: binary_sensor_win
  
debug:
  
text_sensor:
  - platform: debug
    reset_reason:
      id: debug_reset_reason
      name: Reset Reason
      disabled_by_default: true
  - platform: template
    name: Key Action
    id: text_sensor_key_action
    update_interval: never
  - platform: template
    name: Key Name
    id: text_sensor_key_name
    update_interval: never
